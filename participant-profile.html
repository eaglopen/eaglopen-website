<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/png" href="/assets/images/hero/logo-v2.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AlgoLab participant profile | EAGLOPEN" />
    <title>AlgoLab Participant | EAGLOPEN</title>
    <script src="https://kit.fontawesome.com/bc43529ae8.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/header.css" />
    <link rel="stylesheet" href="assets/css/footer.css" />
    <link rel="stylesheet" href="assets/css/algolab.css" />
  </head>
  <body>
    <header class="main-header">
      <div class="container">
        <a class="logo" href="index.html" aria-label="EAGLOPEN home"><img src="/assets/images/hero/logo-v2.png" alt="" /><span>EAGLOPEN</span></a>
        <nav class="nav" aria-label="Primary navigation"><ul><li><a href="algolab.html">ALGOLAB</a></li><li><a href="algolab-participants.html">PARTICIPANTS</a></li></ul></nav>
      </div>
    </header>
    <main class="al-profile-page">
      <div class="container">
        <article class="al-profile-view" id="participant-profile" aria-live="polite"></article>
      </div>
    </main>
    <script>
      (() => {
        const profile = document.querySelector("#participant-profile");
        const params = new URLSearchParams(window.location.search);
        const participant = {
          name: params.get("name"),
          image: params.get("image"),
          description: params.get("description"),
          cohort: params.get("cohort"),
          certificate: params.get("certificate"),
          id: params.get("id"),
        };
        if (!participant.name || !participant.image || !participant.cohort) {
          profile.innerHTML = '<h1>Profile not found</h1><p>This participant profile may have moved.</p><a class="al-profile-back" href="algolab-participants.html"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to participants</a>';
          return;
        }
        document.title = `${participant.name} | EAGLOPEN AlgoLab`;
        const escapeHtml = (value) =>
          String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
        const name = escapeHtml(participant.name);
        const description = escapeHtml(participant.description);

        const certificateIdLine = participant.id
          ? `<p class="al-certificate-id">Certificate ID: ${escapeHtml(participant.id)}</p>`
          : "";
        const certificateHtml = participant.certificate
          ? `<section class="al-certificate">
              <span class="al-verified-badge al-certificate-badge"><i class="fa-solid fa-certificate" aria-hidden="true"></i> Verified Certificate</span>
              ${certificateIdLine}
              <figure class="al-certificate-figure">
                <img src="${escapeHtml(participant.certificate)}" alt="${name}'s EAGLOPEN AlgoLab verified certificate" />
              </figure>
              <a class="al-certificate-download" href="${escapeHtml(participant.certificate)}" download="${name.replace(/[^a-z0-9]+/gi, "-")}-EAGLOPEN-Algolab-Certificate.png" aria-label="Download ${name}'s verified certificate">
                <i class="fa-solid fa-download" aria-hidden="true"></i> <span>Download Certificate</span>
              </a>
            </section>`
          : "";

        profile.innerHTML = `
          <img src="${escapeHtml(participant.image)}" alt="${name}" />
          <span class="al-verified-badge"><i class="fa-solid fa-circle-check" aria-hidden="true"></i> Verified Profile</span>
          ${participant.certificate ? "" : certificateIdLine}
          <h1>${name}</h1>
          <span class="al-alumni-cohort">AlgoLab ${escapeHtml(participant.cohort)}</span>
          <p>${description}</p>
          ${certificateHtml}
          <a class="al-profile-back" href="algolab-participants.html"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to participants</a>
        `;
      })();
    </script>
    <script src="assets/js/clean-routes.js"></script>
  </body>
</html>
