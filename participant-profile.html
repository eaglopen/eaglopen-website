<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/jpeg" href="assets/images/hero/logo.jpg" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AlgoLab participant profile | EAGLOPEN" />
    <title>AlgoLab Participant | EAGLOPEN</title>
    <script src="https://kit.fontawesome.com/bc43529ae8.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/header.css" />
    <link rel="stylesheet" href="assets/css/footer.css" />
    <link rel="stylesheet" href="assets/css/algolab.css" />
  </head>
  <body>
    <header class="main-header">
      <div class="container">
        <a class="logo" href="index.html" aria-label="EAGLOPEN home"><img src="assets/images/hero/logo.jpg" alt="" /><span>EAGLOPEN</span></a>
        <nav class="nav" aria-label="Primary navigation"><ul><li><a href="algolab.html">ALGOLAB</a></li><li><a href="algolab-participants.html">PARTICIPANTS</a></li></ul></nav>
      </div>
    </header>
    <main class="al-profile-page">
      <div class="container">
        <article class="al-profile-view" id="participant-profile" aria-live="polite"></article>
      </div>
    </main>
    <script>
      (() => {
        const profile = document.querySelector("#participant-profile");
        const params = new URLSearchParams(window.location.search);
        const participant = {
          name: params.get("name"),
          image: params.get("image"),
          description: params.get("description"),
          cohort: params.get("cohort"),
        };
        if (!participant.name || !participant.image || !participant.cohort) {
          profile.innerHTML = '<h1>Profile not found</h1><p>This participant profile may have moved.</p><a class="al-profile-back" href="algolab-participants.html"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to participants</a>';
          return;
        }
        document.title = `${participant.name} | EAGLOPEN AlgoLab`;
        const image = document.createElement("img"); image.src = participant.image; image.alt = participant.name;
        const name = document.createElement("h1"); name.textContent = participant.name;
        const cohort = document.createElement("span"); cohort.className = "al-alumni-cohort"; cohort.textContent = `AlgoLab ${participant.cohort}`;
        const description = document.createElement("p"); description.textContent = participant.description;
        const back = document.createElement("a"); back.className = "al-profile-back"; back.href = "algolab-participants.html"; back.innerHTML = '<i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to participants';
        profile.append(image, name, cohort, description, back);
      })();
    </script>
    <script src="assets/js/clean-routes.js"></script>
  </body>
</html>
