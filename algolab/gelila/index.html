<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/png" href="/assets/images/hero/logo-v2.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Gelila Abi is a verified EAGLOPEN AlgoLab 2026 participant." />
    <title>Gelila Abi | EAGLOPEN AlgoLab</title>
    <script src="https://kit.fontawesome.com/bc43529ae8.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/header.css" />
    <link rel="stylesheet" href="/assets/css/footer.css" />
    <link rel="stylesheet" href="/assets/css/algolab.css" />
    <style>
      .al-verified-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.4em;
        background: #1c8a4c;
        color: #ffffff;
        font-size: 0.85rem;
        font-weight: 600;
        padding: 0.35em 0.9em;
        border-radius: 999px;
        margin: 0.5em 0 1em;
      }
      .al-verified-badge i {
        font-size: 0.9em;
      }
      .al-certificate-id {
        font-family: monospace;
        font-size: 0.85rem;
        color: #bbbbbb;
        letter-spacing: 0.03em;
        margin: 0 0 1em;
      }
      .al-certificate {
        margin-top: 40px;
        padding-top: 34px;
        border-top: 1px solid rgba(255, 255, 255, 0.16);
      }
      .al-verified-badge.al-certificate-badge {
        background: #c9a84c;
        color: #14202e;
        margin-bottom: 0.35em;
      }
      .al-certificate-figure {
        width: 100%;
        max-width: 560px;
        margin: 16px auto 20px;
        padding: 8px;
        background: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 14px;
        box-shadow: 0 24px 50px -30px rgba(0, 0, 0, 0.85);
      }
      .al-profile-view .al-certificate-figure img {
        width: 100%;
        height: auto;
        object-fit: contain;
        border: none;
        border-radius: 8px;
        outline: none;
      }
      .al-certificate-download {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 12px 22px;
        border-radius: 999px;
        background: linear-gradient(110deg, #c9a84c, #f0d98f);
        box-shadow: 0 14px 28px -16px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.5);
        color: #14202e;
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        text-decoration: none;
        transition: transform 0.3s var(--ease-expo), box-shadow 0.3s ease;
      }
      .al-certificate-download i {
        color: #14202e;
      }
      .al-certificate-download:hover {
        transform: translateY(-2px);
        box-shadow: 0 22px 38px -18px rgba(201, 168, 76, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.5);
      }
      .al-certificate-download:active {
        transform: translateY(-1px) scale(0.98);
      }
      .al-certificate-download:focus-visible {
        outline: 3px solid var(--color-secondary-light);
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <header class="main-header">
      <div class="container">
        <a class="logo" href="/index.html" aria-label="EAGLOPEN home"><img src="/assets/images/hero/logo-v2.png" alt="" /><span>EAGLOPEN</span></a>
        <nav class="nav" aria-label="Primary navigation"><ul><li><a href="/algolab.html">ALGOLAB</a></li><li><a href="/algolab-participants.html">PARTICIPANTS</a></li></ul></nav>
      </div>
    </header>
    <main class="al-profile-page">
      <div class="container">
        <article class="al-profile-view" id="participant-profile" aria-live="polite">
          <img src="/assets/images/algolab-2026/algo2026/Gelila.jpg" alt="Gelila Abi" />
          <span class="al-verified-badge"><i class="fa-solid fa-circle-check" aria-hidden="true"></i> Verified Profile</span>
          
          <h1>Gelila Abi</h1>
          <span class="al-alumni-cohort">AlgoLab 2026 Participant</span>
          <p>A passionate student exploring coding, AI, and technology through EAGLOPEN AlgoLab 2026.</p>
          <section class="al-certificate">
        <span class="al-verified-badge al-certificate-badge"><i class="fa-solid fa-certificate" aria-hidden="true"></i> Verified Certificate</span>
        <p class="al-certificate-id">Certificate ID: EAGLOPEN-ALG-2026-P-034</p>
        <figure class="al-certificate-figure">
          <img src="/certificates/gelila.png" alt="Gelila Abi's EAGLOPEN AlgoLab verified certificate" />
        </figure>
        <a class="al-certificate-download" href="/certificates/gelila.png" download="gelila-EAGLOPEN-Algolab-Certificate.png" aria-label="Download Gelila Abi's verified certificate">
          <i class="fa-solid fa-download" aria-hidden="true"></i> <span>Download Certificate</span>
        </a>
      </section>
          <a class="al-profile-back" href="/algolab-participants.html"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to participants</a>
        </article>
      </div>
    </main>
    <script src="/assets/js/clean-routes.js"></script>
  </body>
</html>
