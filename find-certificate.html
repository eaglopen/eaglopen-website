    <link rel="icon" type="image/png" href="/assets/images/hero/logo-v2.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Find My Certificate | EAGLOPEN AlgoLab</title>
    <meta
      name="description"
      content="Find and verify your EAGLOPEN AlgoLab certificate using your unique Student ID."
    />

      src="https://kit.fontawesome.com/bc43529ae8.js"

    ></script>

    <style>
      .find-cert-page {
        min-height: 70vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 4rem 1rem;
      }
      .find-cert-card {
        width: 100%;
        max-width: 560px;
        background: var(--color-surface, #1a1f2e);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        padding: 3rem 2.5rem;
        box-shadow: 0 30px 60px -30px rgba(0, 0, 0, 0.7);
        text-align: center;
      }
      .find-cert-card .cert-icon {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: linear-gradient(135deg, #c9a84c, #f0d98f);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 1.8rem;
        color: #14202e;
        margin-bottom: 1.5rem;
      }
      .find-cert-card h1 {
        font-size: 1.6rem;
        margin: 0 0 0.5rem;
        color: var(--color-text, #ffffff);
      }
      .find-cert-card .subtitle {
        color: var(--color-text-muted, #8a8f98);
        font-size: 0.95rem;
        margin: 0 0 2rem;
      }
      .cert-search-form {
        display: flex;
        gap: 0.75rem;
        margin-bottom: 1.5rem;
      }
      .cert-search-input {
        flex: 1;
        padding: 0.85rem 1.1rem;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.04);
        color: var(--color-text, #ffffff);
        font-size: 1rem;
        font-family: monospace;
        letter-spacing: 0.04em;
        outline: none;
        transition: border-color 0.25s ease;
      }
      .cert-search-input::placeholder {
        color: rgba(255, 255, 255, 0.25);
        font-family: sans-serif;
        letter-spacing: 0;
      }
      .cert-search-input:focus {
        border-color: #c9a84c;
      }
      .cert-search-btn {
        padding: 0.85rem 1.5rem;
        border-radius: 12px;
        border: none;
        background: linear-gradient(110deg, #c9a84c, #f0d98f);
        color: #14202e;
        font-size: 0.95rem;
        font-weight: 700;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 0.5em;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        white-space: nowrap;
      }
      .cert-search-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 20px -8px rgba(201, 168, 76, 0.6);
      }
      .cert-search-btn:active {
        transform: translateY(0) scale(0.98);
      }
      .cert-result {
        display: none;
        margin-top: 1.5rem;
        padding: 1.25rem;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.06);
      }
      .cert-result.found {
        display: block;
        border-color: rgba(28, 138, 76, 0.3);
        background: rgba(28, 138, 76, 0.06);
      }
      .cert-result.not-found {
        display: block;
        border-color: rgba(220, 60, 60, 0.3);
        background: rgba(220, 60, 60, 0.06);
      }
      .cert-result .result-label {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--color-text-muted, #8a8f98);
        margin-bottom: 0.5rem;
      }
      .cert-result .result-name {
        font-size: 1.15rem;
        font-weight: 700;
        color: var(--color-text, #ffffff);
        margin: 0 0 0.25rem;
      }
      .cert-result .result-id {
        font-family: monospace;
        font-size: 0.85rem;
        color: rgba(255, 255, 255, 0.35);
        margin-bottom: 1rem;
      }
      .cert-result .result-cohort {
        font-size: 0.9rem;
        color: var(--color-text-muted, #8a8f98);
        margin-bottom: 1rem;
      }
      .cert-result .result-link {
        display: inline-flex;
        align-items: center;
        gap: 0.5em;
        padding: 0.7rem 1.4rem;
        border-radius: 999px;
        background: linear-gradient(110deg, #c9a84c, #f0d98f);
        color: #14202e;
        font-size: 0.9rem;
        font-weight: 700;
        text-decoration: none;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      .cert-result .result-link:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 24px -10px rgba(201, 168, 76, 0.6);
      }
      .cert-result.not-found .result-name {
        color: #e55;
      }
      .find-cert-back {
        display: inline-flex;
        align-items: center;
        gap: 0.5em;
        margin-top: 1.5rem;
        color: var(--color-text-muted, #8a8f98);
        text-decoration: none;
        font-size: 0.9rem;
        transition: color 0.2s ease;
      }
      .find-cert-back:hover {
        color: var(--color-text, #ffffff);
      }
      @media (max-width: 540px) {
        .find-cert-card {
          padding: 2rem 1.25rem;
        }
        .cert-search-form {
          flex-direction: column;
        }
        .cert-search-btn {
          justify-content: center;
        }
      }
    </style>

    <main class="find-cert-page">

        </div>
        <h1>Find My Certificate</h1>
        <p class="subtitle">
          Enter your AlgoLab Student ID to find and verify your certificate.
        </p>
        <form class="cert-search-form" id="certSearchForm" onsubmit="return false;">
          <input
            type="text"

            id="certSearchInput"

            autocomplete="off"
            spellcheck="false"
          />
          <button type="submit" class="cert-search-btn" id="certSearchBtn">
            <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
            Search
          </button>
        </form>
        <div class="cert-result" id="certResult"></div>
        <a href="algolab-participants.html" class="find-cert-back">
          <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to
          Participants
        </a>
      </div>
    </main>

        const form = document.getElementById("certSearchForm");
        const input = document.getElementById("certSearchInput");
        const resultEl = document.getElementById("certResult");

        function doSearch() {
          const query = input.value.trim();
          if (!query) {
            resultEl.className = "cert-result";
            resultEl.innerHTML = "";
            return;
          }

          const match = participants.find(
            (p) => p.id.toUpperCase() === query.toUpperCase()
          );

          if (match && match.certificate) {
            resultEl.className = "cert-result found";
            resultEl.innerHTML =
              '<div class="result-label">Certificate Found</div>' +
              '<p class="result-name">' + match.name + "</p>" +
              '<p class="result-id">' + match.id + "</p>" +
              '<p class="result-cohort">AlgoLab ' + match.cohort + " Cohort</p>" +
              '<a class="result-link" href="algolab/' + match.slug + '/">' +
              '<i class="fa-solid fa-certificate" aria-hidden="true"></i> View Certificate' +
              "</a>";
          } else if (match) {
            resultEl.className = "cert-result found";
            resultEl.innerHTML =
              '<div class="result-label">Student Found</div>' +
              '<p class="result-name">' + match.name + "</p>" +
              '<p class="result-id">' + match.id + "</p>" +
              '<p class="result-cohort">AlgoLab ' + match.cohort + " Cohort</p>" +
              '<a class="result-link" href="algolab/' + match.slug + '/">' +
              '<i class="fa-solid fa-user" aria-hidden="true"></i> View Profile' +
              "</a>";
          } else {
            resultEl.className = "cert-result not-found";
            resultEl.innerHTML =
              '<div class="result-label">Not Found</div>' +
              '<p class="result-name">No matching Student ID found</p>' +
              '<p class="result-cohort" style="margin-bottom:0;">Please double-check your ID and try again.</p>';
          }
        }

        form.addEventListener("submit", (e) => {
          e.preventDefault();
          doSearch();
        });

        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            doSearch();
          }
        });
